name: WatermarkCamera
options:
  bundleIdPrefix: com.yeex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WatermarkCamera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WatermarkCamera
    settings:
      base:
        INFOPLIST_FILE: WatermarkCamera/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatermarkCamera/Resources/WatermarkCamera.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.yeex.watermarkcamera
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: WatermarkCamera/Resources/WatermarkCamera.entitlements
      properties:
        com.apple.developer.weatherkit: true
